<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<title>管理者ログイン — TCK Workshop ライティング添削コース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<style>
body{justify-content:flex-start}
.top-bar{display:flex}
.logo-mark{display:inline-flex;align-items:center;gap:8px}
.header-divider{width:1px;height:16px;background:var(--ink-200);margin:0 12px}
.header-title{font-size:.88em;color:var(--ink-500);font-weight:500}
.login-card{background:var(--white);border:1px solid var(--paper);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,40,23,.08);width:100%;max-width:420px;overflow:hidden;margin:24px auto}
.login-header{background:linear-gradient(135deg,var(--green-deep),var(--green-dark));padding:28px 28px 22px;text-align:center;color:#fff;position:relative;overflow:hidden}
.login-header::before{content:"";position:absolute;top:0;right:0;width:160px;height:100%;background:radial-gradient(circle at top right, rgba(201,169,97,.18), transparent 70%);pointer-events:none}
.login-header .brand-logo{height:44px;margin-bottom:14px;position:relative;z-index:1}
.login-header .kicker{font-family:var(--font-jp);font-size:.74em;font-weight:700;letter-spacing:.04em;color:var(--gold);margin-bottom:8px;position:relative;z-index:1}
.login-header h1{font-family:var(--font-jp);font-size:1.4em;font-weight:700;letter-spacing:.02em;margin-bottom:4px;position:relative;z-index:1}
.login-header p{font-size:.84em;color:rgba(255,255,255,.78);position:relative;z-index:1;font-family:var(--font-jp);line-height:1.6}
.login-body{padding:26px 28px 22px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-family:var(--font-jp);font-size:.82em;font-weight:700;color:var(--green);margin-bottom:6px;letter-spacing:.04em}
.form-input{width:100%;padding:12px 14px 12px 42px;font-size:.95em;font-family:var(--font-en),var(--font-jp);border:1.5px solid var(--paper);border-radius:10px;background:var(--white);color:var(--ink-900);outline:none;transition:border-color .2s, box-shadow .2s}
.form-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,118,70,.12)}
.form-input::placeholder{color:var(--ink-200)}
.input-wrap{position:relative}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:var(--ink-500);pointer-events:none}
.btn-login{width:100%;padding:13px;font-family:var(--font-jp);font-size:1em;font-weight:700;color:#fff;background:var(--green);border:none;border-radius:999px;cursor:pointer;transition:all .2s;margin-top:8px;letter-spacing:.04em}
.btn-login:hover{background:var(--green-dark);box-shadow:0 6px 18px rgba(0,118,70,.22);transform:translateY(-1px)}
.btn-login:disabled{background:var(--ink-200);color:var(--ink-500);cursor:not-allowed;transform:none;box-shadow:none}
.error-msg{background:#FDF4F0;border:1px solid #E5B8A0;border-left:4px solid var(--terracotta);color:#8A3E24;border-radius:10px;padding:10px 14px;font-size:.85em;margin-bottom:16px;display:none;align-items:center;gap:8px}
.error-msg.show{display:flex}
.error-msg svg{width:16px;height:16px;fill:var(--terracotta);flex-shrink:0}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:.82em;color:var(--ink-500);text-align:center;margin:6px 0 18px;font-family:var(--font-jp);line-height:1.7}
.note code{background:#FBF6EC;padding:1px 6px;border-radius:4px;font-size:.95em}
.back-link{display:block;margin-top:16px;text-align:center;font-size:.82em;color:var(--ink-500);text-decoration:underline;font-family:var(--font-jp)}
.back-link:hover{color:var(--green)}
.login-footer{border-top:1px solid var(--paper);padding:12px 28px 14px;text-align:center;font-size:.78em;color:var(--ink-500);font-family:var(--font-jp);letter-spacing:.02em}
</style>
</head>
<body>
<div class="top-bar">
  <div class="logo-mark">
    <img class="brand-logo" src="assets/tck-logo.png" alt="TCK Workshop" style="height:28px;width:auto">
    <span class="header-divider"></span>
    <span class="header-title">管理者ログイン</span>
  </div>
</div>
<div class="main">
  <div class="login-card">
    <div class="login-header">
      <img class="brand-logo" src="assets/tck-logo.png" alt="TCK Workshop">
      <div class="kicker">INTERNAL — STAFF ONLY</div>
      <h1>管理者ログイン</h1>
      <p>採点・バンドスコア計算ツール<br>管理者ID とパスワードを入力してください</p>
    </div>
    <div class="login-body">
      <div class="error-msg" id="errorMsg">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span id="errorText"></span>
      </div>

      <div class="form-group">
        <label for="adminId">管理者ID</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <input type="text" class="form-input" id="adminId" placeholder="管理者ID" autocomplete="username" autofocus>
        </div>
      </div>
      <div class="form-group">
        <label for="adminPassword">パスワード</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <input type="password" class="form-input" id="adminPassword" placeholder="パスワード" autocomplete="current-password">
        </div>
      </div>
      <button class="btn-login" id="loginBtn" onclick="doAdminLogin()">
        <span id="loginBtnText">ログイン</span>
      </button>

      <a href="index.html" class="back-link">← 受講者ログインへ戻る</a>
    </div>
    <div class="login-footer">TCK Workshop ライティング添削コース — 管理者用</div>
  </div>
</div>

<script src="js/admin-auth.js"></script>
<script>
  if (ADMIN_AUTH.get()) location.href = 'admin.html';

  document.getElementById('adminPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doAdminLogin(); });
  document.getElementById('adminId').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('adminPassword').focus(); });

  async function doAdminLogin(){
    const id   = document.getElementById('adminId').value.trim();
    const pass = document.getElementById('adminPassword').value;
    const btn  = document.getElementById('loginBtn');
    const txt  = document.getElementById('loginBtnText');
    const err  = document.getElementById('errorMsg');
    const errT = document.getElementById('errorText');

    if (!id || !pass) { err.classList.add('show'); errT.textContent = 'IDとパスワードを入力してください。'; return; }

    err.classList.remove('show');
    btn.disabled = true;
    txt.innerHTML = '<span class="spinner"></span>ログイン中…';

    try {
      const result = await ADMIN_AUTH.login(id, pass);
      if (result.success && ADMIN_AUTH.acceptSession(result)) {
        location.href = 'admin.html';
        return;
      }
      err.classList.add('show');
      errT.textContent = result.message || 'ログインに失敗しました。';
      btn.disabled = false; txt.textContent = 'ログイン';
      document.getElementById('adminPassword').value = '';
      document.getElementById('adminPassword').focus();
    } catch (e) {
      err.classList.add('show');
      errT.textContent = '通信エラー: ' + (e && e.message ? e.message : String(e));
      btn.disabled = false; txt.textContent = 'ログイン';
    }
  }
</script>
<script defer src="../js/tm-footer.js"></script>
</body>
</html>
